<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar task1</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        nav{
            background-color: black;
            color: white;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        nav > ul{
            display: flex;
            gap: 20px;
        }
        nav> ul> li{
            text-transform: uppercase;
            font: 19px;
            font-weight: bold;
            letter-spacing: 1.4px;
            list-style: none;
            cursor: pointer;
        }
        nav> ul> li:hover{
            color:lightslategray;
        }

        nav >div>button{
            border-radius: 10px;
            border: 20px;
            padding: 10px;
            font-weight: bold;
            margin: 5px;
            width: 80px;
            cursor: pointer;
        }
        nav >div>button:hover{
            background-color: lightgray;
        }




    </style>
</head>
<body>
    <nav>
        <h2>MY LOGO</h2>
        <ul>
            <li>Home</li>
            <li>about</li>
            <li>Contact</li>
        </ul>
        <div>
            <button>LOGIN</button>
            <button>SIGNUP</button>
        </div>
    </nav>
</body>
</html>
