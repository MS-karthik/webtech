<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>
    
    <table border="10" width="600" height="200" cellspacing="5" cellpadding="10">
        <caption>Employee table</caption>
        <tr>

            <th>ename</th>
            <th>sal</th>
        </tr>
        <tr>
            <td>1</td>

            <td>8000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>smith</td>
            <td>10000</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Adam</td>
            <td>10000</td>
        </tr>

    </table>

</body>
</html>
